<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumos Médicos | Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globais - Identidade Visual Clean & Editorial */
        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #e6f5ea; /* Nosso tom verde pastel */
            color: #111827;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        /* Container Principal */
        .container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Cabeçalho com a Fonte Serifada */
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.2rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
            text-align: center;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #4b5563;
            margin-bottom: 60px;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }

        /* Grid de Navegação - 3 Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            width: 100%;
        }

        /* Card Estilo "Claude" - Minimalista e Impecável */
        .card {
            background: #ffffff;
            aspect-ratio: 1 / 0.8;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #e5e7eb;
            padding: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.04);
            border-color: #d1d5db;
        }

        /* Títulos dos Cards com a Fonte Serifada */
        .card-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #111827;
            text-align: center;
            line-height: 1.2;
            margin: 0;
        }

        /* Footer Assinado */
        footer {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .footer-name {
            font-weight: 500;
            color: #374151;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .grid { grid-template-columns: 1fr; }
            .card { aspect-ratio: auto; padding: 50px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Resumos Médicos</h1>
        <p class="subtitle">Acesse seus guias de estudo e revisões clínicas atualizadas.</p>
        
        <div class="grid">
            <a href="clinicaIII.html" class="card">
                <h2 class="card-title">Clínica<br>Integrada III</h2>
            </a>

            <a href="etica_medica.html" class="card">
                <h2 class="card-title">Ética<br>Médica</h2>
            </a>

            <a href="farmaco.html" class="card">
                <h2 class="card-title">Farmacologia<br>Aplicada</h2>
            </a>
        </div>
    </div>

    <footer>
        Criado por <span class="footer-name">@brendaasena_</span>
    </footer>

</body>
</html>
